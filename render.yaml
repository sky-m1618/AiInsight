services:
  # Python Backend Web Service
  - type: web
    name: aiinsight-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn run:app -w 4 -b 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiinsight-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://aiinsight-frontend.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # Vue 3 Frontend Static Site
  - type: web
    name: aiinsight-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://aiinsight-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aiinsight-db
    databaseName: aiinsight
    user: aiinsight_user
    plan: free
    region: ohio
