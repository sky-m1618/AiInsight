services:
  # 1. Python Backend Web Service
  - type: web
    name: aiinsight-backend
    runtime: python       # FIXED: Changed from env: python
    region: ohio
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn run:app -w 4 -b 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiinsight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # OPTIONAL: Cleaned up hardcoded CORS by referencing the frontend component dynamically
      - key: CORS_ORIGINS
        value: ${aiinsight-frontend.url}

  # 2. Vue 3 Frontend Static Site
  - type: web
    name: aiinsight-frontend
    runtime: static      # FIXED: Changed from env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      # FIXED: Uses dynamic blueprint interpolation instead of a hardcoded URL string
      - key: VITE_API_URL
        value: ${aiinsight-backend.url}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aiinsight-db
    databaseName: aiinsight
    user: aiinsight_user
    plan: free
    region: ohio
